<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Restrita</title>
</head>

<body>

    <div>
        Seja bem vindo 
        <span id="labelLogin">XXX</span>
    </div>

    <form>
        <label for="nome">Nome</label>
        <input id="nome" type="text"
            placeholder="Digite o seu nome"/>
        <br>
        <label for="nomeCompleto">Nome completo</label>
        <input id="nomeCompleto" type="text"
            placeholder="Digite o seu nome completo"/>
        <br>
        <label for="curso">Curso</label>
        <input id="curso" type="text"
            placeholder="Ex: Discente em Análise e Desenvolvimento de Sistemas"/>
        <br>
        <span onClick="salvarDados()">Salvar</span>
    </form>

    <span onClick="carregarDados()">Carregar</span>
    <script>
        // Padrão do professor - objeto portifolio
        let portifolio = {};
        
        // Função salvar - salva os dados no LocalStorage
        const salvarDados = () => {
            // Pega os valores dos inputs
            const nome = document.getElementById("nome").value;
            const nomeCompleto = document.getElementById("nomeCompleto").value;
            const curso = document.getElementById("curso").value;
            
            // Salva no objeto portifolio
            portifolio.nome = nome;
            portifolio.nomeCompleto = nomeCompleto;
            portifolio.curso = curso;
            
            // Converte para JSON e salva no LocalStorage
            const objetoConvertido = JSON.stringify(portifolio);
            localStorage.setItem("portifolio", objetoConvertido);
            
            // Salva também o nome na chave 'usuario' para o portfólio ler
            localStorage.setItem("usuario", nomeCompleto || nome);
            
            // Aviso para confirmar que funcionou
            alert('Dados salvos! Nome: ' + (nomeCompleto || nome));
        }
        
        // Função carregar - reflete o nome no span
        const carregarDados = () => {
            const usuario = localStorage.getItem("usuario");
            const labelLogin = document.getElementById("labelLogin");
            if (usuario) {
                labelLogin.innerText = usuario;
            } else {
                labelLogin.innerText = "XXX";
            }
        }
        
        // Quando a página carregar, já chama a função carregarDados
        window.onload = function () {
            carregarDados();
        };
    </script>

</body>

</html>
